name: Unpack inbox zips

# Upload a .zip into the "inbox" folder and this unpacks it into the site,
# then deletes the zip. Files with the same path are overwritten.
on:
  push:
    branches: [main]
    paths: ['inbox/*.zip']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency: unpack-inbox

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zips
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(inbox/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No zips in inbox/"; exit 0; fi
          for z in "${zips[@]}"; do
            echo "Unpacking $z"
            tmp=$(mktemp -d)
            unzip -q -o "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            src="$tmp"
            # GitHub "Download ZIP" files wrap everything in one folder: step inside it
            if [ "$(ls -A "$tmp" | wc -l)" -eq 1 ] && [ -d "$tmp/$(ls -A "$tmp")" ]; then
              src="$tmp/$(ls -A "$tmp")"
            fi
            # never let a zip replace git data or this workflow
            rm -rf "$src/.git" "$src/.github"
            cp -a "$src"/. .
            rm -f "$z"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Unpack zip from inbox"
          git push

      - name: Ask GitHub Pages to rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
        
