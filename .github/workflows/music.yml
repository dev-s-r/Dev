name: Update music list

on:
  push:
    paths:
      - "music/tracks/**"
      - "music/covers/**"
      - "music/track-info.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install mutagen

      - name: Build music/tracks.js and extract cover art
        run: python .github/scripts/build_tracks.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/tracks.js music/covers music/track-info.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update music list"
            git pull --rebase
            git push
          fi
